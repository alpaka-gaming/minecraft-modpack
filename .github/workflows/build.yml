name: Build & Release

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish GitHub Release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      fullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}
      majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}
      preReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0

      - name: Display Version Information
        run: |
          echo "=== GitVersion Information ==="
          echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "PreReleaseLabel: ${{ steps.gitversion.outputs.preReleaseLabel }}"
          echo "PreReleaseTag: ${{ steps.gitversion.outputs.preReleaseTag }}"
          echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"

      - name: Build Modpack
        run: |
          chmod +x ./build.sh
          ./build.sh "${{ steps.gitversion.outputs.semVer }}"

      - name: Upload Modpack Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Alpaka-Modpack-${{ steps.gitversion.outputs.semVer }}
          path: |
            Alpaka-Modpack.mrpack
            Alpaka-Modpack-*.mrpack
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release == true)
    permissions:
      contents: write
    steps:
      - name: Download Modpack Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Alpaka-Modpack-${{ needs.build.outputs.semVer }}

      - name: Publish GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: "v${{ needs.build.outputs.semVer }}"
          name: "v${{ needs.build.outputs.semVer }}"
          artifacts: "*.mrpack"
          draft: false
          prerelease: ${{ needs.build.outputs.preReleaseLabel != '' }}
          generateReleaseNotes: true
          allowUpdates: true
